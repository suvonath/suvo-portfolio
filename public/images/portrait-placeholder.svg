<svg width="480" height="540" viewBox="0 0 480 540" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="50%" stop-color="#161F30" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#A78BFA" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#A78BFA" />
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background Card -->
  <rect width="480" height="540" rx="24" fill="url(#bgGrad)" />
  <rect width="480" height="540" rx="24" fill="url(#grid)" />
  <rect x="1" y="1" width="478" height="538" rx="23" stroke="url(#borderGrad)" stroke-width="2" />

  <!-- Ambient Glow in Center -->
  <circle cx="240" cy="220" r="140" fill="#60A5FA" fill-opacity="0.08" filter="blur(30px)" />

  <!-- Code/Tech Geometric Lines -->
  <circle cx="240" cy="210" r="108" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4" />
  <circle cx="240" cy="210" r="92" stroke="#60A5FA" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Stylized Developer Silhouette / Monogram Avatar -->
  <circle cx="240" cy="180" r="46" fill="#1E293B" stroke="#60A5FA" stroke-width="2" />
  <path d="M176 304 C 176 250, 304 250, 304 304" fill="#1E293B" stroke="#60A5FA" stroke-width="2" />

  <!-- Monogram Initials -->
  <text x="240" y="190" text-anchor="middle" fill="url(#accentGrad)" font-family="system-ui, sans-serif" font-weight="700" font-size="32" letter-spacing="2">SN</text>

  <!-- Terminal Badge Bottom -->
  <rect x="70" y="360" width="340" height="64" rx="12" fill="#0B0F19" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
  <circle cx="94" cy="392" r="5" fill="#10B981" />
  <text x="110" y="396" fill="#F8FAFC" font-family="system-ui, sans-serif" font-weight="600" font-size="14">Suvo Dev Nath</text>
  <text x="386" y="396" text-anchor="end" fill="#60A5FA" font-family="system-ui, sans-serif" font-weight="500" font-size="13">Web Developer</text>

  <!-- Photo Notice Pill -->
  <rect x="90" y="445" width="300" height="34" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1" stroke-dasharray="3 3" />
  <text x="240" y="467" text-anchor="middle" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">
    Replace with /public/images/portrait.jpg
  </text>
</svg>
